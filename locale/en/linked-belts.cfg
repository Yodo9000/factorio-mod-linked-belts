[entity-name]
linked-belts=Linked __1__

[mod-setting-name]
force-compatibility=Ignore incompatibilities between some mods
lb-max-distance=Maximal link distance
lb-same-surface-only=Only link belts on the same surface

[mod-setting-description]
force-compatibility-description=Warning! Enabling this setting will allow LinkedBelts to work with mods that are slightly incompatible (namely, if they both add undergrounds of the same speed), but if those mod incompatibilities are fixed later, it can cause that tier of linked-belt to disappear!
lb-max-distance=Distance in tiles between the two belts of a pair. Zero is no limit at all, which is how the mod always worked. A belt that is placed too far away does not link, it waits for a partner of its own instead.
lb-same-surface-only=A pair may not cross surfaces. Linking a planet to a space platform or to another planet is off then.

[linked-belts]
too-far=Too far from the waiting linked belt, this one waits for its own partner now.
other-surface=The waiting linked belt is on another surface, this one waits for its own partner now.
